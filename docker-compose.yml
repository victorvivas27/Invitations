services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invitation}
      POSTGRES_USER: ${POSTGRES_USER:-invitation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invitation_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/invitation}
      POSTGRES_USER: ${POSTGRES_USER:-invitation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invitation_dev}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      BACKEND_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
