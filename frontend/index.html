<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mi Invitación" />
    <meta
      name="description"
      content="Crea invitaciones digitales para celebrar momentos especiales"
    />

    <!-- Vista previa al compartir la invitación -->
    <meta property="og:locale" content="es_CL" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mi Invitación" />
    <meta property="og:title" content="Mi Invitación" />
    <meta
      property="og:description"
      content="¡Estás invitado a celebrar un momento especial!"
    />
    <meta property="og:image" content="/images/icon-invitacion.png" />
    <meta property="og:image:alt" content="Sobre con una carta de invitación" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/images/icon-invitacion.png" />

    <link
      rel="icon"
      type="image/png"
      href="/images/icon-invitacion-favicon.png"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/images/icon-invitacion-favicon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="1254x1254"
      href="/images/icon-invitacion.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        background: #050b16;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #050b16;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 2rem;
        color: #ffffff;
        background:
          radial-gradient(
            circle at 18% 18%,
            rgba(239, 51, 64, 0.3),
            transparent 32%
          ),
          radial-gradient(
            circle at 82% 78%,
            rgba(30, 112, 214, 0.34),
            transparent 36%
          ),
          linear-gradient(145deg, #050b16 0%, #0b2345 55%, #07101f 100%);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      .boot-loader__content {
        display: grid;
        justify-items: center;
        gap: 1rem;
        text-align: center;
      }

      .boot-loader__mark {
        position: relative;
        display: grid;
        width: 5.5rem;
        height: 5.5rem;
        place-items: center;
        border: 1px solid rgba(239, 51, 64, 0.5);
        border-radius: 1.65rem;
        background: linear-gradient(
          145deg,
          rgba(18, 43, 80, 0.94),
          rgba(5, 11, 22, 0.96)
        );
        box-shadow:
          0 0 2.4rem rgba(215, 25, 32, 0.22),
          0 1.5rem 4rem rgba(0, 0, 0, 0.42);
        animation: boot-float 2.2s ease-in-out infinite;
      }

      .boot-loader__mark::before,
      .boot-loader__mark::after {
        position: absolute;
        content: '';
        border-radius: inherit;
      }

      .boot-loader__mark::before {
        inset: -0.6rem;
        border: 1px solid rgba(239, 51, 64, 0.38);
        animation: boot-pulse 1.8s ease-out infinite;
      }

      .boot-loader__mark::after {
        width: 0.58rem;
        height: 0.58rem;
        right: 0.65rem;
        top: 0.65rem;
        background: #ef3340;
        box-shadow:
          0 0 0 0.3rem rgba(239, 51, 64, 0.16),
          0 0 1rem rgba(239, 51, 64, 0.72);
      }

      .boot-loader__envelope {
        width: 2.9rem;
        height: 2.9rem;
        color: #ef3340;
        filter: drop-shadow(0 0.35rem 0.55rem rgba(239, 51, 64, 0.38));
      }

      .boot-loader__title {
        margin: 0.45rem 0 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(1.45rem, 5vw, 1.8rem);
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .boot-loader__status {
        margin: 0;
        color: #b8cce8;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .boot-loader__progress {
        width: min(12rem, 58vw);
        height: 0.22rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(184, 204, 232, 0.14);
      }

      .boot-loader__progress::after {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ef3340, #2f8cff, #ef3340);
        animation: boot-progress 1.3s ease-in-out infinite;
        content: '';
      }

      @keyframes boot-float {
        50% {
          transform: translateY(-0.35rem);
        }
      }

      @keyframes boot-pulse {
        70%,
        100% {
          opacity: 0;
          transform: scale(1.18);
        }
      }

      @keyframes boot-progress {
        from {
          transform: translateX(-115%);
        }
        to {
          transform: translateX(255%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader__mark,
        .boot-loader__mark::before,
        .boot-loader__progress::after {
          animation-duration: 3s;
        }
      }
    </style>
    <title>Mi Invitación</title>
  </head>
  <body>
    <div id="root">
      <main
        class="boot-loader"
        aria-busy="true"
        aria-label="Cargando Mi Invitación"
      >
        <div class="boot-loader__content">
          <div class="boot-loader__mark" aria-hidden="true">
            <svg class="boot-loader__envelope" viewBox="0 0 48 48" fill="none">
              <path
                d="M7 14.5A3.5 3.5 0 0 1 10.5 11h27a3.5 3.5 0 0 1 3.5 3.5v19a3.5 3.5 0 0 1-3.5 3.5h-27A3.5 3.5 0 0 1 7 33.5v-19Z"
                stroke="currentColor"
                stroke-width="2.6"
              />
              <path
                d="m9 14 12.7 10.1a3.7 3.7 0 0 0 4.6 0L39 14M9 34l10.1-9M39 34l-10.1-9"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M33.5 7.5v5M31 10h5"
                stroke="#195baa"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <p class="boot-loader__title">Mi Invitación</p>
          <p class="boot-loader__status">Preparando algo especial</p>
          <div class="boot-loader__progress" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
