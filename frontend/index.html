<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050b16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mi Invitación" />
    <meta
      name="description"
      content="Crea invitaciones digitales para celebrar momentos especiales"
    />

    <!-- Vista previa al compartir la invitación -->
    <meta property="og:locale" content="es_CL" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mi Invitación" />
    <meta property="og:title" content="Mi Invitación" />
    <meta
      property="og:description"
      content="¡Estás invitado a celebrar un momento especial!"
    />
    <meta property="og:image" content="/images/icon-invitacion.png" />
    <meta property="og:image:alt" content="Sobre con una carta de invitación" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/images/icon-invitacion.png" />

    <link
      rel="icon"
      type="image/png"
      href="/images/icon-invitacion-favicon.png"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/images/icon-invitacion-favicon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="1254x1254"
      href="/images/icon-invitacion.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      href="/images/icon-invitacion.png"
      as="image"
      fetchpriority="high"
    />
    <style>
      :root {
        color-scheme: dark;
        background: #050b16;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #050b16;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: max(2rem, env(safe-area-inset-top))
          max(2rem, env(safe-area-inset-right))
          max(2rem, env(safe-area-inset-bottom))
          max(2rem, env(safe-area-inset-left));
        opacity: 1;
        visibility: visible;
        color: #ffffff;
        background:
          radial-gradient(
            circle at 18% 18%,
            rgba(239, 51, 64, 0.3),
            transparent 32%
          ),
          radial-gradient(
            circle at 82% 78%,
            rgba(30, 112, 214, 0.34),
            transparent 36%
          ),
          linear-gradient(145deg, #050b16 0%, #0b2345 55%, #07101f 100%);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        transition:
          opacity 300ms ease,
          visibility 300ms ease;
        will-change: opacity;
      }

      .boot-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader__ambient {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .boot-loader__orb {
        position: absolute;
        width: min(44rem, 86vw);
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0.2;
        filter: blur(3rem);
        animation: boot-orb 7s ease-in-out infinite alternate;
      }

      .boot-loader__orb--one {
        top: -28%;
        left: -24%;
        background: #d71920;
      }

      .boot-loader__orb--two {
        right: -28%;
        bottom: -32%;
        background: #1e70d6;
        animation-delay: -3.5s;
      }

      .boot-loader__content {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 1rem;
        text-align: center;
      }

      .boot-loader__mark {
        position: relative;
        display: grid;
        width: 5.5rem;
        height: 5.5rem;
        place-items: center;
        border: 1px solid rgba(239, 51, 64, 0.5);
        border-radius: 1.65rem;
        background: linear-gradient(
          145deg,
          rgba(18, 43, 80, 0.94),
          rgba(5, 11, 22, 0.96)
        );
        box-shadow:
          0 0 2.4rem rgba(215, 25, 32, 0.22),
          0 1.5rem 4rem rgba(0, 0, 0, 0.42);
        animation: boot-float 2.2s ease-in-out infinite;
      }

      .boot-loader__mark::before,
      .boot-loader__mark::after {
        position: absolute;
        content: '';
        border-radius: inherit;
      }

      .boot-loader__mark::before {
        inset: -0.6rem;
        border: 1px solid rgba(239, 51, 64, 0.38);
        animation: boot-pulse 1.8s ease-out infinite;
      }

      .boot-loader__mark::after {
        width: 0.58rem;
        height: 0.58rem;
        right: 0.65rem;
        top: 0.65rem;
        background: #ef3340;
        box-shadow:
          0 0 0 0.3rem rgba(239, 51, 64, 0.16),
          0 0 1rem rgba(239, 51, 64, 0.72);
      }

      .boot-loader__envelope {
        display: block;
        width: 4.35rem;
        height: 4.35rem;
        object-fit: contain;
        filter: drop-shadow(0 0.45rem 0.7rem rgba(239, 51, 64, 0.28));
      }

      .boot-loader__title {
        margin: 0.45rem 0 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(1.45rem, 5vw, 1.8rem);
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .boot-loader__status {
        margin: 0;
        color: #b8cce8;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .boot-loader__progress {
        width: min(12rem, 58vw);
        height: 0.22rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(184, 204, 232, 0.14);
      }

      .boot-loader__progress::after {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ef3340, #2f8cff, #ef3340);
        animation: boot-progress 1.3s ease-in-out infinite;
        content: '';
      }

      @keyframes boot-float {
        50% {
          transform: translateY(-0.35rem);
        }
      }

      @keyframes boot-pulse {
        70%,
        100% {
          opacity: 0;
          transform: scale(1.18);
        }
      }

      @keyframes boot-progress {
        from {
          transform: translateX(-115%);
        }
        to {
          transform: translateX(255%);
        }
      }

      @keyframes boot-orb {
        to {
          opacity: 0.28;
          transform: translate3d(4%, -3%, 0) scale(1.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader__mark,
        .boot-loader__mark::before,
        .boot-loader__mark::after,
        .boot-loader__progress::after,
        .boot-loader__orb {
          animation: none !important;
        }

        .boot-loader {
          transition-duration: 100ms;
        }
      }
    </style>
    <title>Mi Invitación</title>
  </head>
  <body>
    <div
      id="boot-loader"
      class="boot-loader"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="Cargando Mi Invitación"
    >
      <div class="boot-loader__ambient" aria-hidden="true">
        <span class="boot-loader__orb boot-loader__orb--one"></span>
        <span class="boot-loader__orb boot-loader__orb--two"></span>
      </div>
      <div class="boot-loader__content">
        <div class="boot-loader__mark" aria-hidden="true">
          <img
            class="boot-loader__envelope"
            src="/images/icon-invitacion.png"
            alt=""
            decoding="async"
            fetchpriority="high"
          />
        </div>
        <p class="boot-loader__title">Mi Invitación</p>
        <p class="boot-loader__status">Preparando algo especial</p>
        <div class="boot-loader__progress" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
