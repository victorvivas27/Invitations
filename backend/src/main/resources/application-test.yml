server:
  port: 5055

spring:
  datasource:
    url: jdbc:h2:mem:invitation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025
    username:
    password:

app:
  frontend-url: http://localhost:5173
  upload-directory: build/test-uploads
  account-activation-expiration-seconds: 3600

  jwt:
    secret: test-only-secret-key-with-at-least-32-characters
    expiration-seconds: 3600
    issuer: https://test.invitation.local
