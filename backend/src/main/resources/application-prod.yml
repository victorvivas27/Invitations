server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:600000}

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

app:
  frontend-url: ${FRONTEND_URL}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
