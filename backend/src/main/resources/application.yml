spring:
  application:
    name: Invitation
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/invitation_db}
    username: ${DB_USER:invitation}
    password: ${DB_PASSWORD:invitation_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-directory: ${UPLOAD_DIRECTORY:uploads}
  account-activation-expiration-seconds: ${ACCOUNT_ACTIVATION_EXPIRATION_SECONDS:86400}
  jwt:
    secret: ${JWT_SECRET:development-only-secret-at-least-32-characters}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: ${JWT_ISSUER:https://api.invitation.local}
