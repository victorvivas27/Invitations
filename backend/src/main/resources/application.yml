spring:
  application:
    name: invitation-app

  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]

  profiles:
    active: ${APP_PROFILE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/invitation_db}
    username: ${DB_USER:invitation}
    password: ${DB_PASSWORD:invitation_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  email:
    provider: ${EMAIL_PROVIDER:gmail}
    from: ${EMAIL_FROM:}

  upload-directory: ${UPLOAD_DIRECTORY:uploads}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:invitations_upload}

  account-activation-expiration-seconds: ${ACCOUNT_ACTIVATION_EXPIRATION_SECONDS:86400}

  jwt:
    secret: ${JWT_SECRET:development-only-secret-at-least-32-characters}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: ${JWT_ISSUER:https://api.invitation.local}
