spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invitation_db}
    username: ${DB_USER:invitation}
    password: ${DB_PASSWORD:invitation_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-at-least-32-characters}
    issuer: ${JWT_ISSUER:https://api.invitation.local}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web: WARN
    org.springframework.security: WARN
