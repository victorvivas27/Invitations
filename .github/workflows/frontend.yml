name: Frontend

on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend.yml', '.github/scripts/**']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml', '.github/scripts/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm lint
      - name: Tests y cobertura
        run: pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile=test-results.json
      - name: Resumen visual
        if: always()
        run: node ../.github/scripts/write-quality-summary.mjs frontend "$PWD"
      - name: Publicar reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-report
          path: |
            frontend/coverage
            frontend/test-results.json
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm build
